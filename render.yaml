databases:
  - name: doski-db
    plan: free
    databaseName: doski
    user: doski

services:
  - type: web
    name: doski
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doski-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: GUARDIAN_SECRET
        generateValue: true
      - key: PHX_HOST
        fromService:
          type: web
          name: doski
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ECTO_SSL
        value: "true"
      - key: PHX_SERVER
        value: "true"
